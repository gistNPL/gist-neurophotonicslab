<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Member | GIST Neurophotonics Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GIST Neurophotonics Lab: neurophotonics, biomedical imaging, and AI research" />
  <meta property="og:image" content="https://gistnpl.github.io/gist-neurophotonicslab/assets/img/main/main2.png" />

  <link rel="stylesheet" href="../assets/css/style.css?v=20261119-2">
  <link rel="stylesheet" href="../assets/css/member.css?v=20261119-directory">
</head>

<body>
<header class="site-header"></header>

  <main class="member-page">
    <div class="member-intro">
      <h1>Members</h1>
      <nav class="member-directory-nav" id="member-directory-nav" aria-label="Member groups"></nav>
    </div>
    <div id="member-sections"></div>
  </main>

  <footer>
    © 2025 GIST Neurophotonics Lab. All rights reserved.
  </footer>

  <script src="../assets/js/members-data.js?v=20261119-directory"></script>
  <script>
  (function () {
    if (!window.MEMBERS_HELPERS) return;
    const helpers = window.MEMBERS_HELPERS;
    const { escape } = helpers;
    const sections = window.MEMBERS;

    function renderMember(member, heading) {
      const name = escape(member.name);
      const profile = member.detailPage
        ? `<a class="member-profile-link" href="${escape(member.detailPage)}">${name}</a>`
        : name;
      const photo = member.image
        ? `<img class="member-photo" src="${escape(helpers.imageUrl(member.image))}" alt="Photo of ${name}" width="104" height="128" loading="lazy" decoding="async" />`
        : '';
      const badge = member.badge
        ? ` <span class="member-badge">${escape(member.badge)}</span>`
        : '';
      const affiliations = (member.affiliations || [])
        .map(affiliation => `<p class="member-detail">${escape(affiliation)}</p>`)
        .join('');
      const interests = (member.interests || []).map(escape).join(' · ');
      const details = (member.details || [])
        .map(detail => `<p class="member-detail">${detail}</p>`)
        .join('');

      return `
        <li class="member-card${photo ? ' member-card-with-photo' : ''}">
          ${photo}
          <div class="member-text">
            <${heading} class="member-name">${profile}${badge}</${heading}>
            ${member.role ? `<p class="member-role">${escape(member.role)}</p>` : ''}
            ${affiliations}
            ${interests ? `<p class="member-interests"><strong>Research interests</strong> ${interests}</p>` : ''}
            ${details}
          </div>
        </li>
      `;
    }

    function renderList(members, heading) {
      return `<ul class="member-list${members.length === 1 ? ' member-list-single' : ''}" role="list">${members.map(member => renderMember(member, heading)).join('')}</ul>`;
    }

    document.getElementById('member-directory-nav').innerHTML = sections.map(section =>
      `<a href="#${escape(section.section)}">${escape(section.title)}</a>`
    ).join('');

    document.getElementById('member-sections').innerHTML = sections.map(section => {
      const id = escape(section.section);
      const groups = (section.groups || []).map(group => `
        <div class="member-group">
          <h3>${escape(group.title)}</h3>
          ${renderList(group.members, 'h4')}
        </div>
      `).join('');
      return `
        <section class="member-section" id="${id}" aria-labelledby="${id}-heading">
          <h2 id="${id}-heading">${escape(section.title)}</h2>
          ${section.description ? `<p class="member-section-description">${escape(section.description)}</p>` : ''}
          ${section.members?.length ? renderList(section.members, 'h3') : ''}
          ${groups}
        </section>
      `;
    }).join('');
  })();
  </script>
<script src="/gist-neurophotonicslab/assets/js/site-chrome.js?v=20261119-2" defer></script>
</body>
</html>
