<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Member | GIST Neurophotonics Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/member.css">
</head>

<body>
<header class="site-header"></header>

  <main class="member-page">
    <h1>Members</h1>
    <div id="member-sections"></div>
  </main>

  <footer>
    © 2025 GIST Neurophotonics Lab. All rights reserved.
  </footer>

  <script src="../assets/js/members-data.js"></script>
  <script>
  (function () {
    if (!window.MEMBERS_HELPERS) return;
    const { imageUrl, escape } = window.MEMBERS_HELPERS;
    const container = document.getElementById('member-sections');

    function renderMember(m) {
      const photoHtml = m.image
        ? `<img src="${escape(imageUrl(m.image))}" alt="Photo of ${escape(m.name)}" class="member-photo" />`
        : '';

      const badgeHtml = m.badge
        ? ` <span class="member-badge">${escape(m.badge)}</span>`
        : '';

      const detailsHtml = (m.details || [])
        .map(d => `<div class="member-detail">${d}</div>`)
        .join('');

      const actionsHtml = m.detailPage
        ? `<div class="member-actions"><a href="${escape(m.detailPage)}" class="detail-link">DETAIL</a></div>`
        : '';

      const innerCore = `
        <div class="member-text">
          <div class="member-name">${escape(m.name)}${badgeHtml}</div>
          ${m.role ? `<div class="member-role">${escape(m.role)}</div>` : ''}
          ${detailsHtml}
          ${actionsHtml}
        </div>
      `;

      const cardInner = m.image
        ? `<div class="member-card-content">${photoHtml}${innerCore}</div>`
        : innerCore;

      if (m.detailPage) {
        const href = escape(m.detailPage);
        return `
          <div class="member-card member-link" role="link" tabindex="0"
               onclick="location.href='${href}';"
               onkeydown="if(event.key==='Enter'){location.href='${href}';}">
            ${cardInner}
          </div>
        `;
      }
      return `<div class="member-card">${cardInner}</div>`;
    }

    container.innerHTML = window.MEMBERS.map(sec => {
      const memberCards = (sec.members || []).map(renderMember).join('');
      const descHtml = sec.description
        ? `<p class="section-desc">${escape(sec.description)}</p>`
        : '';
      return `
        <section class="member-section" id="${escape(sec.section)}">
          <h2>${escape(sec.title)}</h2>
          ${descHtml}
          ${memberCards ? `<div class="member-list">${memberCards}</div>` : ''}
        </section>
      `;
    }).join('');
  })();
  </script>
<script src="/gist-neurophotonicslab/assets/js/site-chrome.js" defer></script>
</body>
</html>
