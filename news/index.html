<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>News | GIST Neurophotonics Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .news-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 60px;
    }
    .news-page h1 { margin: 0 0 6px 0; }
    .news-page-sub { color: #666; margin: 0 0 28px 0; }

    .news-card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .news-card-link {
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      height: 100%;
      cursor: pointer;
    }
    .news-card-link:hover,
    .news-card-link:focus-visible {
      transform: translateY(-4px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12);
      outline: none;
    }
    .news-card-thumb {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
      background: #f1f3f6;
    }
    .news-card-body {
      padding: 16px 18px 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .news-card-date {
      font-size: 0.8rem;
      color: #888;
      margin-bottom: 6px;
    }
    .news-card-title {
      font-size: 1.05rem;
      line-height: 1.4;
      margin: 0 0 8px 0;
      font-weight: 700;
    }
    .news-card-desc {
      font-size: 0.9rem;
      color: #555;
      line-height: 1.6;
      margin: 0 0 16px 0;
    }
    .news-card-button {
      margin-top: auto;
      align-self: flex-start;
      display: inline-block;
      padding: 8px 16px;
      background: #4b6cb7;
      color: #fff;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background 0.15s ease;
    }
    .news-card-link:hover .news-card-button {
      background: #3a559a;
    }
    .news-empty {
      color: #888;
      padding: 40px 0;
      text-align: center;
    }

    @media (max-width: 900px) {
      .news-card-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .news-card-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/gist-neurophotonicslab/" aria-label="Go to Home">
    <img
      class="brand-logo"
      src="/gist-neurophotonicslab/assets/img/home/logo.png"
      alt="GIST Neurophotonics Lab logo"
    />
    <span class="brand-text">GIST Neurophotonics Lab</span>
  </a>

  <nav class="site-nav">
    <a href="/gist-neurophotonicslab/">Home</a>
    <a href="/gist-neurophotonicslab/research/">Research</a>
    <a href="/gist-neurophotonicslab/member/">Member</a>
    <a href="/gist-neurophotonicslab/publication/">Publication</a>
    <a href="/gist-neurophotonicslab/gallery/">Gallery</a>
    <a href="/gist-neurophotonicslab/news/">News</a>
    <a href="/gist-neurophotonicslab/contact/">Contact</a>
  </nav>
</header>


  <main class="news-page">
    <h1>News</h1>
    <p class="news-page-sub">Recent updates, awards, and events from the lab.</p>

    <ul class="news-card-grid" id="news-list">
      <!-- Cards rendered from /assets/js/news.js -->
    </ul>
  </main>

  <footer>
    © 2025 GIST Neurophotonics Lab. All rights reserved.
  </footer>

  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/news.js?v=20260814"></script>
  <script>
    (function () {
      const list = document.getElementById('news-list');
      if (!list || !window.NEWS_HELPERS) return;
      const { sortedDesc, formatDate, escape, detailUrl } = window.NEWS_HELPERS;
      const items = sortedDesc();
      if (items.length === 0) {
        list.outerHTML = '<p class="news-empty">No news yet.</p>';
        return;
      }
      list.innerHTML = items.map(n => `
        <li>
          <a class="news-card-link" href="${escape(detailUrl(n.id))}">
            <img class="news-card-thumb" src="${escape(n.thumbnail)}" alt="${escape(n.title)}" />
            <div class="news-card-body">
              <div class="news-card-date">${escape(formatDate(n.date))}</div>
              <h2 class="news-card-title">${escape(n.title)}</h2>
              <p class="news-card-desc">${escape(n.summary)}</p>
              <span class="news-card-button">Read more →</span>
            </div>
          </a>
        </li>
      `).join('');
    })();
  </script>
<script src="/gist-neurophotonicslab/assets/js/site-chrome.js" defer></script>
</body>
</html>
