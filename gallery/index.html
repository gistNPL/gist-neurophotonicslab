<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Gallery | GIST Neurophotonics Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="../assets/css/style.css" />
  <link rel="stylesheet" href="../assets/css/gallery.css?v=20260814" />
</head>
<body>

<header class="site-header"></header>

  <main class="gallery-page">

    <section class="gallery-header">
      <h1>Lab Gallery</h1>
      <p>Moments from conferences, workshops, and lab events.</p>
    </section>

    <!-- Year Filter (rendered from gallery-data.js) -->
    <section class="gallery-filter" id="gallery-filter"></section>

    <!-- View Toggle -->
    <section class="gallery-toggle">
      <button class="toggle-btn active" data-view="gallery">Gallery</button>
      <button class="toggle-btn citizenship-toggle" data-view="citizenship">
        <span class="star">★</span> NPL Citizenship
      </button>
    </section>

    <!-- Gallery years (rendered from gallery-data.js) -->
    <div id="gallery-years"></div>

    <!-- Citizenship (rendered from gallery-data.js) -->
    <section class="gallery-citizenship" id="gallery-citizenship" hidden></section>

    <!-- Lightbox (click a photo to enlarge) -->
    <div class="gallery-lightbox" id="galleryLightbox">
      <img id="lightboxImage" src="" alt="Expanded view">
    </div>

  </main>

  <footer>
    © 2025 GIST Neurophotonics Lab. All rights reserved.
  </footer>

<script src="../assets/js/gallery-data.js?v=20260816"></script>
<script>
(function () {
  if (!window.GALLERY_HELPERS) return;
  // NOTE: photoUrl / citizenshipUrl reference `this.IMG_BASE`, so they must
  // stay bound to GALLERY_HELPERS. Plain destructuring breaks `this` and
  // produces "undefined/..." URLs (= the 404s we saw on the live site).
  const H = window.GALLERY_HELPERS;
  const photoUrl = H.photoUrl.bind(H);
  const citizenshipUrl = H.citizenshipUrl.bind(H);
  const { allYears, escape } = H;

  // ---- Render year filter buttons ----
  const filterEl = document.getElementById('gallery-filter');
  const years = allYears();
  filterEl.innerHTML = [
    '<button class="filter-btn active" data-year="all">All</button>',
    ...years.map(y => `<button class="filter-btn" data-year="${y}">${y}</button>`),
  ].join('');

  // ---- Render gallery year sections ----
  const yearsContainer = document.getElementById('gallery-years');
  yearsContainer.innerHTML = (window.GALLERY_YEARS || []).map(yearBlock => `
    <section class="gallery-year" data-year="${yearBlock.year}">
      <h2>${yearBlock.year}</h2>
      <div class="gallery-event">
        ${yearBlock.events.map(event => `
          <h3>${escape(event.title)}</h3>
          ${event.video ? `
            <div class="gallery-video">
              <iframe
                src="https://www.youtube-nocookie.com/embed/${escape(event.video.youtubeId)}"
                title="${escape(event.video.title || event.title)}"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
            </div>
          ` : ''}
          <div class="gallery-grid">
            ${event.photos.map((file, i) => `
              <div class="gallery-item" data-year="${yearBlock.year}">
                <img loading="lazy"
                     src="${escape(photoUrl(yearBlock.year, file))}"
                     alt="${escape(event.title)} — photo ${i + 1}">
              </div>
            `).join('')}
          </div>
        `).join('')}
      </div>
    </section>
  `).join('');

  // ---- Render citizenship ----
  const citizenshipEl = document.getElementById('gallery-citizenship');
  citizenshipEl.innerHTML = (window.GALLERY_CITIZENSHIP || []).map(group => `
    <div class="citizenship-year" data-year="${group.year}">
      <h2>${group.year} NPL Citizenship Awards</h2>
      <div class="citizenship-grid">
        ${group.awards.map(award => {
          const url = citizenshipUrl(award.pdf);
          return `
            <a class="citizenship-card" href="${escape(url)}" target="_blank" rel="noopener">
              <div class="citizenship-preview">
                <iframe src="${escape(url)}#toolbar=0&navpanes=0&scrollbar=0&view=FitH"
                        title="${escape(award.name)} certificate"></iframe>
                <span class="citizenship-overlay"></span>
              </div>
              <div class="citizenship-meta">
                <span class="citizenship-name">${escape(award.name)}</span>
                <span class="citizenship-year-tag">${group.year}</span>
              </div>
            </a>
          `;
        }).join('')}
      </div>
    </div>
  `).join('');

  // ---- Filter / toggle behavior ----
  const filterButtons = document.querySelectorAll('.filter-btn');
  const toggleButtons = document.querySelectorAll('.toggle-btn');
  const gallerySections = document.querySelectorAll('.gallery-year');
  const galleryItems = document.querySelectorAll('.gallery-item');
  const citizenshipSection = citizenshipEl;
  const citizenshipYears = document.querySelectorAll('.citizenship-year');

  let currentView = 'gallery';
  let currentYear = 'all';

  function applyFilter() {
    if (currentView === 'gallery') {
      citizenshipSection.hidden = true;
      gallerySections.forEach(s => { s.hidden = false; });
      galleryItems.forEach(item => {
        const show = currentYear === 'all' || item.dataset.year === currentYear;
        item.style.display = show ? 'block' : 'none';
      });
    } else {
      gallerySections.forEach(s => { s.hidden = true; });
      citizenshipSection.hidden = false;
      citizenshipYears.forEach(group => {
        const show = currentYear === 'all' || group.dataset.year === currentYear;
        group.style.display = show ? 'block' : 'none';
      });
    }
  }

  filterButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      filterButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentYear = btn.dataset.year;
      applyFilter();
    });
  });

  toggleButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      toggleButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentView = btn.dataset.view;
      applyFilter();
    });
  });

  // ---- Lightbox: click a photo to enlarge ----
  const lightbox = document.getElementById('galleryLightbox');
  const lightboxImg = document.getElementById('lightboxImage');

  yearsContainer.addEventListener('click', (e) => {
    const img = e.target.closest('.gallery-item img');
    if (!img) return;
    lightboxImg.src = img.src;
    lightboxImg.alt = img.alt || 'Expanded view';
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
  });

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightboxImg.src = '';
    document.body.style.overflow = '';
  }

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });
})();
</script>
<script src="/gist-neurophotonicslab/assets/js/site-chrome.js" defer></script>
</body>
</html>
