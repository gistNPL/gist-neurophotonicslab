<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gallery | GIST Neurophotonics Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GIST Neurophotonics Lab: neurophotonics, biomedical imaging, and AI research" />
  <meta property="og:image" content="https://gistnpl.github.io/gist-neurophotonicslab/assets/img/main/main2.png" />

  <link rel="stylesheet" href="../assets/css/style.css?v=20261119-2" />
  <link rel="stylesheet" href="../assets/css/gallery.css?v=20261119-2" />
</head>
<body>

<header class="site-header"></header>

  <main class="gallery-page">

    <section class="gallery-header">
      <h1>Lab Gallery</h1>
      <p>Moments from conferences, workshops, and lab events.</p>
    </section>

    <div class="gallery-controls">
      <div class="gallery-toggle" role="group" aria-label="Gallery view">
        <button class="toggle-btn" type="button" data-view="gallery" aria-pressed="true" aria-controls="gallery-years">Photos</button>
        <button class="toggle-btn" type="button" data-view="citizenship" aria-pressed="false" aria-controls="gallery-citizenship">NPL Citizenship</button>
      </div>
      <div class="gallery-filter" id="gallery-filter" role="group" aria-label="Filter by year"></div>
    </div>

    <!-- Gallery years (rendered from gallery-data.js) -->
    <div id="gallery-years"></div>

    <!-- Citizenship (rendered from gallery-data.js) -->
    <section class="gallery-citizenship" id="gallery-citizenship" hidden></section>

    <p class="gallery-empty" id="gallery-empty" role="status" hidden></p>

    <dialog class="gallery-lightbox" id="galleryLightbox" aria-labelledby="lightboxTitle">
      <div class="gallery-lightbox-panel">
        <div class="gallery-lightbox-header">
          <h2 id="lightboxTitle"></h2>
          <form method="dialog">
            <button type="submit" class="gallery-lightbox-close" autofocus>Close</button>
          </form>
        </div>
        <img id="lightboxImage" alt="">
        <p id="lightboxStatus" role="status" hidden></p>
        <a class="gallery-lightbox-original" id="lightboxOriginal" target="_blank" rel="noopener">Open original in a new tab</a>
      </div>
    </dialog>

  </main>

  <footer>
    © 2025 GIST Neurophotonics Lab. All rights reserved.
  </footer>

<script src="../assets/js/gallery-data.js?v=20261119"></script>
<script>
(function () {
  if (!window.GALLERY_HELPERS) return;
  const H = window.GALLERY_HELPERS;
  const { escape } = H;

  // ---- Render gallery year sections ----
  const yearsContainer = document.getElementById('gallery-years');
  yearsContainer.innerHTML = (window.GALLERY_YEARS || []).map(yearBlock => `
    <section class="gallery-year" data-year="${yearBlock.year}">
      <h2>${yearBlock.year}</h2>
      ${yearBlock.events.map(event => `
        <section class="gallery-event">
          <h3>${escape(event.title)}</h3>
          ${event.video ? `
            <div class="gallery-video">
              <iframe
                src="https://www.youtube-nocookie.com/embed/${escape(event.video.youtubeId)}"
                title="${escape(event.video.title || event.title)}"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
            </div>
          ` : ''}
          <div class="gallery-grid">
            ${event.photos.map((file, i) => `
              <button type="button" class="gallery-item" aria-haspopup="dialog"
                      aria-label="View ${escape(event.title)} photo ${i + 1} of ${event.photos.length}"
                      data-caption="${escape(event.title)} — photo ${i + 1} of ${event.photos.length}"
                      data-full="${escape(H.photoUrl(yearBlock.year, file))}">
                <img loading="lazy" decoding="async"
                     src="${escape(H.thumbnailUrl(yearBlock.year, file))}"
                     alt="">
              </button>
            `).join('')}
          </div>
        </section>
      `).join('')}
    </section>
  `).join('');

  // ---- Render citizenship ----
  const citizenshipEl = document.getElementById('gallery-citizenship');
  citizenshipEl.innerHTML = (window.GALLERY_CITIZENSHIP || []).map(group => `
    <div class="citizenship-year" data-year="${group.year}">
      <h2>${group.year} NPL Citizenship Awards</h2>
      <div class="citizenship-grid">
        ${group.awards.map(award => {
          const url = escape(H.citizenshipUrl(award.pdf));
          return `
            <article class="citizenship-card">
              <div class="citizenship-preview" aria-hidden="true">
                <iframe src="${url}#toolbar=0&navpanes=0&scrollbar=0&view=FitH"
                        title="${escape(award.name)} certificate" loading="lazy" tabindex="-1" inert></iframe>
              </div>
              <div class="citizenship-meta">
                <a class="citizenship-name" href="${url}" target="_blank" rel="noopener"
                   aria-label="${escape(award.name)}, ${group.year} citizenship award certificate (PDF, opens in a new tab)">${escape(award.name)}</a>
                <span class="citizenship-year-tag">${group.year}</span>
              </div>
            </article>
          `;
        }).join('')}
      </div>
    </div>
  `).join('');

  // ---- Filter / toggle behavior ----
  const filterEl = document.getElementById('gallery-filter');
  const empty = document.getElementById('gallery-empty');
  const viewButtons = document.querySelectorAll('.toggle-btn');
  const views = {
    gallery: { container: yearsContainer, year: 'all' },
    citizenship: { container: citizenshipEl, year: 'all' },
  };
  let activeView = 'gallery';

  function renderYearFilters() {
    const { container, year } = views[activeView];
    const yearLabels = [...new Set(Array.from(container.children, group => group.dataset.year))]
      .sort((first, second) => Number(second) - Number(first));
    filterEl.innerHTML = ['all', ...yearLabels].map(value => `
      <button type="button" class="filter-btn" data-year="${value}"
              aria-pressed="${value === year}" aria-controls="${container.id}">${value === 'all' ? 'All years' : value}</button>
    `).join('');
    filterEl.hidden = yearLabels.length < 2;
  }

  function applyFilter() {
    const { container, year } = views[activeView];
    let visibleYears = 0;
    for (const group of container.children) {
      group.hidden = year !== 'all' && group.dataset.year !== year;
      if (!group.hidden) visibleYears++;
    }
    filterEl.querySelectorAll('.filter-btn').forEach(button => {
      button.setAttribute('aria-pressed', button.dataset.year === year);
    });
    empty.textContent = visibleYears ? '' : 'No items are available for this view.';
    empty.hidden = visibleYears > 0;
  }

  function showView(view) {
    activeView = view;
    viewButtons.forEach(button => {
      const isActive = button.dataset.view === view;
      button.setAttribute('aria-pressed', isActive);
      views[button.dataset.view].container.hidden = !isActive;
    });
    renderYearFilters();
    applyFilter();
  }

  filterEl.addEventListener('click', event => {
    const button = event.target.closest('.filter-btn');
    if (!button) return;
    views[activeView].year = button.dataset.year;
    applyFilter();
  });

  viewButtons.forEach(button => {
    button.addEventListener('click', () => showView(button.dataset.view));
  });
  showView(activeView);

  const lightbox = document.getElementById('galleryLightbox');
  const lightboxImg = document.getElementById('lightboxImage');
  const lightboxTitle = document.getElementById('lightboxTitle');
  const lightboxStatus = document.getElementById('lightboxStatus');
  const originalLink = document.getElementById('lightboxOriginal');
  let photoTrigger = null;

  yearsContainer.addEventListener('click', event => {
    const button = event.target.closest('.gallery-item');
    if (!button) return;
    photoTrigger = button;
    lightboxTitle.textContent = button.dataset.caption;
    lightboxImg.alt = button.dataset.caption;
    originalLink.href = button.dataset.full;
    lightboxImg.hidden = true;
    lightboxStatus.textContent = 'Loading original photo…';
    lightboxStatus.hidden = false;
    lightbox.showModal();
    lightboxImg.src = button.dataset.full;
  });

  lightboxImg.addEventListener('load', () => {
    lightboxImg.hidden = false;
    lightboxStatus.hidden = true;
  });

  lightboxImg.addEventListener('error', () => {
    lightboxStatus.textContent = 'The photo could not be loaded.';
    lightboxStatus.hidden = false;
  });

  lightbox.addEventListener('click', event => {
    if (event.target === lightbox) lightbox.close();
  });

  lightbox.addEventListener('close', () => {
    lightboxImg.removeAttribute('src');
    photoTrigger?.focus({ preventScroll: true });
    photoTrigger = null;
  });
})();
</script>
<script src="/gist-neurophotonicslab/assets/js/site-chrome.js?v=20261119-2" defer></script>
</body>
</html>
