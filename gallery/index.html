<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Gallery | GIST Neurophotonics Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GIST Neurophotonics Lab: neurophotonics, biomedical imaging, and AI research" />
  <meta property="og:image" content="https://gistnpl.github.io/gist-neurophotonicslab/assets/img/main/main2.png" />

  <link rel="stylesheet" href="../assets/css/style.css?v=20261119-restore" />
  <link rel="stylesheet" href="../assets/css/gallery.css?v=20261123-birthday" />
</head>
<body>

<header class="site-header"></header>

  <main class="gallery-page">

    <section class="gallery-header">
      <h1>Lab Gallery</h1>
      <p>Moments from conferences, workshops, and lab events.</p>
    </section>

    <div class="gallery-controls">
      <div class="gallery-toggle" role="group" aria-label="Gallery view">
        <button class="toggle-btn" type="button" data-view="gallery" aria-pressed="true" aria-controls="gallery-years">Photos</button>
        <button class="toggle-btn" type="button" data-view="citizenship" aria-pressed="false" aria-controls="gallery-citizenship">NPL Citizenship</button>
        <button class="toggle-btn" type="button" data-view="birthday" aria-pressed="false" aria-controls="gallery-birthday">Birthday</button>
      </div>
      <div class="gallery-filter" id="gallery-filter" role="group" aria-label="Filter by year"></div>
    </div>

    <!-- Gallery years (rendered from gallery-data.js) -->
    <div id="gallery-years"></div>

    <!-- Citizenship (rendered from gallery-data.js) -->
    <section class="gallery-citizenship" id="gallery-citizenship" hidden></section>

    <section id="gallery-birthday" aria-labelledby="birthday-title" hidden>
      <div class="birthday-header">
        <div>
          <h2 id="birthday-title">Birthday calendar</h2>
          <p>Birthdays follow the current lab roster.</p>
        </div>
        <label class="birthday-year">
          Year
          <select id="birthday-year"></select>
        </label>
      </div>
      <div class="birthday-months" id="birthday-months" role="group" aria-label="Select a month"></div>
      <div class="birthday-results" id="birthday-results" aria-live="polite" aria-atomic="true">
        <h3 id="birthday-month-title"></h3>
        <ul class="birthday-list" id="birthday-list"></ul>
        <p class="gallery-empty" id="birthday-empty" hidden>No birthdays listed for this month.</p>
      </div>
      <section class="birthday-photos" id="birthday-photos" aria-labelledby="birthday-photos-title" hidden>
        <h3 id="birthday-photos-title"></h3>
        <div id="birthday-photo-events"></div>
      </section>
    </section>

    <p class="gallery-empty" id="gallery-empty" role="status" hidden></p>

    <dialog class="gallery-lightbox" id="galleryLightbox" aria-labelledby="lightboxTitle">
      <div class="gallery-lightbox-panel">
        <div class="gallery-lightbox-header">
          <h2 id="lightboxTitle"></h2>
          <form method="dialog">
            <button type="submit" class="gallery-lightbox-close" autofocus>Close</button>
          </form>
        </div>
        <img id="lightboxImage" alt="">
        <p id="lightboxStatus" role="status" hidden></p>
        <a class="gallery-lightbox-original" id="lightboxOriginal" target="_blank" rel="noopener">Open original in a new tab</a>
      </div>
    </dialog>

  </main>

  <footer>
    © 2025 GIST Neurophotonics Lab. All rights reserved.
  </footer>

<script src="../assets/js/gallery-data.js?v=20261123-birthday"></script>
<script src="../assets/js/members-data.js?v=20261123-birthday"></script>
<script>
(function () {
  if (!window.GALLERY_HELPERS) return;
  const H = window.GALLERY_HELPERS;
  const { escape } = H;
  const galleryYears = window.GALLERY_YEARS || [];

  function renderGalleryEvent(year, event, heading = 'h3') {
    return `
        <section class="gallery-event">
          <${heading}>${escape(event.title)}</${heading}>
          ${event.video ? `
            <div class="gallery-video">
              <iframe
                src="https://www.youtube-nocookie.com/embed/${escape(event.video.youtubeId)}"
                title="${escape(event.video.title || event.title)}"
                loading="lazy"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen></iframe>
            </div>
          ` : ''}
          <div class="gallery-grid">
            ${event.photos.map((file, i) => `
              <button type="button" class="gallery-item" aria-haspopup="dialog"
                      aria-label="View ${escape(event.title)} photo ${i + 1} of ${event.photos.length}"
                      data-caption="${escape(event.title)} — photo ${i + 1} of ${event.photos.length}"
                      data-full="${escape(H.photoUrl(year, file))}">
                <img loading="lazy" decoding="async"
                     src="${escape(H.thumbnailUrl(year, file))}"
                     alt="">
              </button>
            `).join('')}
          </div>
        </section>
    `;
  }

  // ---- Render gallery year sections ----
  const yearsContainer = document.getElementById('gallery-years');
  yearsContainer.innerHTML = galleryYears.map(({ year, events }) => {
    const photoEvents = events.filter(event => !event.birthday);
    return photoEvents.length ? `
      <section class="gallery-year" data-year="${year}">
        <h2>${year}</h2>
        ${photoEvents.map(event => renderGalleryEvent(year, event)).join('')}
      </section>
    ` : '';
  }).join('');

  // ---- Render citizenship ----
  const citizenshipEl = document.getElementById('gallery-citizenship');
  citizenshipEl.innerHTML = (window.GALLERY_CITIZENSHIP || []).map(group => `
    <div class="citizenship-year" data-year="${group.year}">
      <h2>${group.year} NPL Citizenship Awards</h2>
      <div class="citizenship-grid">
        ${group.awards.map(award => {
          const url = escape(H.citizenshipUrl(award.pdf));
          return `
            <article class="citizenship-card">
              <div class="citizenship-preview" aria-hidden="true">
                <iframe src="${url}#toolbar=0&navpanes=0&scrollbar=0&view=FitH"
                        title="${escape(award.name)} certificate" loading="lazy" tabindex="-1" inert></iframe>
              </div>
              <div class="citizenship-meta">
                <a class="citizenship-name" href="${url}" target="_blank" rel="noopener"
                   aria-label="${escape(award.name)}, ${group.year} citizenship award certificate (PDF, opens in a new tab)">${escape(award.name)}</a>
                <span class="citizenship-year-tag">${group.year}</span>
              </div>
            </article>
          `;
        }).join('')}
      </div>
    </div>
  `).join('');

  // ---- Birthday calendar ----
  const birthdayEl = document.getElementById('gallery-birthday');
  const birthdayYear = document.getElementById('birthday-year');
  const birthdayMonths = document.getElementById('birthday-months');
  const birthdayMonthTitle = document.getElementById('birthday-month-title');
  const birthdayList = document.getElementById('birthday-list');
  const birthdayEmpty = document.getElementById('birthday-empty');
  const birthdayPhotos = document.getElementById('birthday-photos');
  const birthdayPhotosTitle = document.getElementById('birthday-photos-title');
  const birthdayPhotoEvents = document.getElementById('birthday-photo-events');
  const fullMonths = new Intl.DateTimeFormat('en', { month: 'long', timeZone: 'UTC' });
  const shortMonths = new Intl.DateTimeFormat('en', { month: 'short', timeZone: 'UTC' });
  const calendarDate = new Intl.DateTimeFormat('en', { year: 'numeric', month: 'numeric', timeZone: 'Asia/Seoul' });
  const birthdays = (window.MEMBERS || []).filter(group => group.section !== 'alumni')
    .flatMap(group => group.members || [])
    .filter(member => member.birthday)
    .sort((first, second) => first.birthday.day - second.birthday.day || first.name.localeCompare(second.name));
  const monthButtons = Array.from({ length: 12 }, (_, index) => {
    const date = new Date(Date.UTC(2026, index, 1));
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'filter-btn';
    button.dataset.month = index + 1;
    button.textContent = shortMonths.format(date);
    button.setAttribute('aria-label', fullMonths.format(date));
    button.setAttribute('aria-pressed', 'false');
    button.setAttribute('aria-controls', 'birthday-results');
    return button;
  });
  let selectedMonth;

  function showBirthdayMonth(month) {
    selectedMonth = month;
    const selectedButton = monthButtons[month - 1];
    const year = birthdayYear.value;
    const people = birthdays.filter(member => member.birthday.month === month);
    birthdayMonthTitle.textContent = `${selectedButton.getAttribute('aria-label')} ${year}`;
    birthdayList.innerHTML = people.map(({ name, birthday: { day } }) => {
      const monthDay = [month, day].map(value => String(value).padStart(2, '0')).join('-');
      return `<li><time datetime="${monthDay}">${selectedButton.textContent} ${day}</time><span>${escape(name)}</span></li>`;
    }).join('');
    birthdayList.hidden = people.length === 0;
    birthdayEmpty.hidden = people.length > 0;
    for (const button of monthButtons) {
      button.setAttribute('aria-pressed', button === selectedButton);
    }
    birthdayMonths.scrollLeft = selectedButton.offsetLeft - (birthdayMonths.clientWidth - selectedButton.offsetWidth) / 2;
  }

  function showBirthdayYear() {
    showBirthdayMonth(selectedMonth);
    const year = Number(birthdayYear.value);
    const events = galleryYears.find(group => group.year === year)?.events.filter(event => event.birthday) || [];
    birthdayPhotosTitle.textContent = `${year} birthday photos`;
    birthdayPhotos.hidden = events.length === 0;
    birthdayPhotoEvents.innerHTML = events.map(event => renderGalleryEvent(year, event, 'h4')).join('');
  }

  function openBirthday() {
    const parts = calendarDate.formatToParts(new Date());
    const year = Number(parts.find(part => part.type === 'year').value);
    selectedMonth = Number(parts.find(part => part.type === 'month').value);
    const calendarYears = new Set([year, year + 1]);
    for (let previous = 2026; previous < year; previous++) calendarYears.add(previous);
    for (const group of galleryYears) {
      if (group.events.some(event => event.birthday)) calendarYears.add(group.year);
    }
    birthdayYear.replaceChildren(...[...calendarYears].sort((a, b) => b - a)
      .map(value => new Option(value, value, false, value === year)));
    birthdayMonths.replaceChildren(...monthButtons);
    showBirthdayYear();
  }

  birthdayMonths.addEventListener('click', event => {
    const button = event.target.closest('button[data-month]');
    if (button) showBirthdayMonth(Number(button.dataset.month));
  });
  birthdayYear.addEventListener('change', showBirthdayYear);

  // ---- Filter / toggle behavior ----
  const filterEl = document.getElementById('gallery-filter');
  const empty = document.getElementById('gallery-empty');
  const viewButtons = document.querySelectorAll('.toggle-btn');
  const views = {
    gallery: { container: yearsContainer, year: 'all' },
    citizenship: { container: citizenshipEl, year: 'all' },
    birthday: { container: birthdayEl },
  };
  let activeView = 'gallery';

  function renderYearFilters() {
    const { container, year } = views[activeView];
    const yearLabels = [...new Set(Array.from(container.children, group => group.dataset.year))]
      .sort((first, second) => Number(second) - Number(first));
    filterEl.innerHTML = ['all', ...yearLabels].map(value => `
      <button type="button" class="filter-btn" data-year="${value}"
              aria-pressed="${value === year}" aria-controls="${container.id}">${value === 'all' ? 'All years' : value}</button>
    `).join('');
    filterEl.hidden = yearLabels.length < 2;
  }

  function applyFilter() {
    const { container, year } = views[activeView];
    let visibleYears = 0;
    for (const group of container.children) {
      group.hidden = year !== 'all' && group.dataset.year !== year;
      if (!group.hidden) visibleYears++;
    }
    filterEl.querySelectorAll('.filter-btn').forEach(button => {
      button.setAttribute('aria-pressed', button.dataset.year === year);
    });
    empty.textContent = visibleYears ? '' : 'No items are available for this view.';
    empty.hidden = visibleYears > 0;
  }

  function showView(view) {
    activeView = view;
    viewButtons.forEach(button => {
      const isActive = button.dataset.view === view;
      button.setAttribute('aria-pressed', isActive);
      views[button.dataset.view].container.hidden = !isActive;
    });
    if (view === 'birthday') {
      filterEl.hidden = true;
      empty.hidden = true;
      openBirthday();
      return;
    }
    renderYearFilters();
    applyFilter();
  }

  filterEl.addEventListener('click', event => {
    const button = event.target.closest('.filter-btn');
    if (!button) return;
    views[activeView].year = button.dataset.year;
    applyFilter();
  });

  viewButtons.forEach(button => {
    button.addEventListener('click', () => showView(button.dataset.view));
  });
  showView(activeView);

  const lightbox = document.getElementById('galleryLightbox');
  const lightboxImg = document.getElementById('lightboxImage');
  const lightboxTitle = document.getElementById('lightboxTitle');
  const lightboxStatus = document.getElementById('lightboxStatus');
  const originalLink = document.getElementById('lightboxOriginal');
  let photoTrigger = null;

  function openGalleryPhoto(event) {
    const button = event.target.closest('.gallery-item');
    if (!button) return;
    photoTrigger = button;
    lightboxTitle.textContent = button.dataset.caption;
    lightboxImg.alt = button.dataset.caption;
    originalLink.href = button.dataset.full;
    lightboxImg.hidden = true;
    lightboxStatus.textContent = 'Loading original photo…';
    lightboxStatus.hidden = false;
    lightbox.showModal();
    lightboxImg.src = button.dataset.full;
  }

  yearsContainer.addEventListener('click', openGalleryPhoto);
  birthdayPhotoEvents.addEventListener('click', openGalleryPhoto);

  lightboxImg.addEventListener('load', () => {
    lightboxImg.hidden = false;
    lightboxStatus.hidden = true;
  });

  lightboxImg.addEventListener('error', () => {
    lightboxStatus.textContent = 'The photo could not be loaded.';
    lightboxStatus.hidden = false;
  });

  lightbox.addEventListener('click', event => {
    if (event.target === lightbox) lightbox.close();
  });

  lightbox.addEventListener('close', () => {
    lightboxImg.removeAttribute('src');
    photoTrigger?.focus({ preventScroll: true });
    photoTrigger = null;
  });
})();
</script>
<script src="/gist-neurophotonicslab/assets/js/site-chrome.js?v=20261119-restore" defer></script>
</body>
</html>
